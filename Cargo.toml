[package]
name = "hackgov"
version = "0.1.0"
authors = ["User"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.1", features = ["router", "fullstack"] }
serde = { version = "1", features = ["derive"] }

# Server-only dependencies (backend real: SQLite + hashing de senha + sessões)
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
argon2 = { version = "0.5", optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }
sha2 = { version = "0.10", optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
anyhow = { version = "1", optional = true }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = ["dioxus/server", "dep:rusqlite", "dep:argon2", "dep:rand_core", "dep:sha2", "dep:tokio", "dep:anyhow"]
